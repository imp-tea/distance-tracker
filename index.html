<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Huddleston's Distance Grapher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .left-side, .right-side {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
        }
        .left-side {
            border-right: 1px solid #ccc;
        }
        video, canvas#canvasOutput {
            width: 480px;
            height: 360px;
            border: 2px solid #333;
        }
        #videoElement {
            display: none;
        }
        .graph-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #distanceChart {
            width: 100%;
            max-height: 300px;
        }
        .graph-buttons {
            margin-top: 10px;
        }
        .graph-buttons button {
            margin-right: 5px;
        }
    </style>
    <script defer src="https://docs.opencv.org/3.4.0/opencv.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2 style="text-align:center;">Huddleston's Distance Grapher</h2>

<div class="container">
    <div class="left-side">
        <canvas id="canvasOutput"></canvas>

        <div class="calibration-controls">
            <label for="distanceInput">Distance from Camera (inches):</label>
            <input type="number" id="distanceInput" name="distanceInput" value="24">
            <br>
            <label for="widthInput">Face Width (inches):</label>
            <input type="number" id="widthInput" name="widthInput" value="6">
            <br>
            <button id="calibrateButton">Calibrate!</button>
        </div>

        <video id="videoElement" autoplay playsinline></video>
    </div>

    <div class="right-side">
        <div class="graph-container">
            <canvas id="distanceChart"></canvas>
            <div class="graph-buttons">
                <button id="beginGraphingButton">Begin Graphing</button>
                <button id="clearGraphButton">Clear Graph</button>
            </div>
        </div>
    </div>
</div>

<script>
    let videoReady = false;
    let openCVReady = false;
    let focalLength = null;
    let knownDistance = 24;
    let realWidth = 6;
    let chart;
    let graphing = false;
    let startTime = null;

    function checkOpenCVReady() {
        if (cv && cv.CascadeClassifier) {
            openCVReady = true;
            if (videoReady) {
                startProcessing();
            }
        } else {
            setTimeout(checkOpenCVReady, 100);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('videoElement');
        const calibrateButton = document.getElementById('calibrateButton');
        const beginGraphingButton = document.getElementById('beginGraphingButton');
        const clearGraphButton = document.getElementById('clearGraphButton');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(error => {
                console.error("Error accessing the webcam: ", error);
            });

        video.addEventListener('canplay', () => {
            videoReady = true;
            if (openCVReady) {
                startProcessing();
            }
        });

        checkOpenCVReady();

        calibrateButton.addEventListener('click', calibrateCamera);
        beginGraphingButton.addEventListener('click', beginGraphing);
        clearGraphButton.addEventListener('click', clearGraph);

        initializeChart();
    });

    function startProcessing() {
        const video = document.getElementById('videoElement');
        const canvasOutput = document.getElementById('canvasOutput');
        const ctx = canvasOutput.getContext('2d');
        const src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);

        const faceCascade = new cv.CascadeClassifier();
        faceCascade.load('haarcascade_frontalface_default.xml');

        canvasOutput.width = video.videoWidth;
        canvasOutput.height = video.videoHeight;

        function processFrame() {
            try {
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
                let imageData = ctx.getImageData(0, 0, video.videoWidth, video.videoHeight);
                src.data.set(imageData.data);

                cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY);

                let faces = new cv.RectVector();
                faceCascade.detectMultiScale(src, faces, 1.1, 3, 0);

                let largestFace = null;
                let maxFaceArea = 0;

                for (let i = 0; i < faces.size(); i++) {
                    let face = faces.get(i);
                    let area = face.width * face.height;
                    if (area > maxFaceArea) {
                        maxFaceArea = area;
                        largestFace = face;
                    }
                }

                let distance = null;

                if (largestFace) {
                    const observedWidth = largestFace.width;
                    distance = focalLength ? (realWidth * focalLength) / observedWidth : null;
                    distance = distance ? parseFloat(distance.toFixed(2)) : null;

                    cv.rectangle(src, new cv.Point(largestFace.x, largestFace.y), new cv.Point(largestFace.x + largestFace.width, largestFace.y + largestFace.height), [255, 0, 0, 255], 2);
                    cv.putText(src, distance !== null ? distance + " inches" : "Not calibrated", new cv.Point(largestFace.x, largestFace.y - 10), cv.FONT_HERSHEY_SIMPLEX, 0.6, [255, 0, 0, 255]);
                }

                if (graphing && distance !== null) {
                    let currentTime = (Date.now() - startTime) / 1000;
                    chart.data.datasets[0].data.push({ x: parseFloat(currentTime.toFixed(2)), y: distance });
                    chart.update();
                }

                cv.imshow('canvasOutput', src);
                faces.delete();

                requestAnimationFrame(processFrame);
            } catch (err) {
                console.error("Error in processing frame:", err);
            }
        }

        requestAnimationFrame(processFrame);
    }

    function calibrateCamera() {
        const distanceInput = document.getElementById('distanceInput');
        const widthInput = document.getElementById('widthInput');
        knownDistance = parseFloat(distanceInput.value);
        realWidth = parseFloat(widthInput.value);

        if (isNaN(knownDistance) || isNaN(realWidth)) {
            alert("Please enter valid numbers for distance and width.");
            return;
        }

        const video = document.getElementById('videoElement');
        const canvasFrame = document.createElement('canvas');
        const ctx = canvasFrame.getContext('2d', { willReadFrequently: true });
        const src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);

        canvasFrame.width = video.videoWidth;
        canvasFrame.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
        let imageData = ctx.getImageData(0, 0, video.videoWidth, video.videoHeight);
        src.data.set(imageData.data);

        cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY);

        let faceCascade = new cv.CascadeClassifier();
        faceCascade.load('haarcascade_frontalface_default.xml');

        let faces = new cv.RectVector();
        faceCascade.detectMultiScale(src, faces, 1.1, 3, 0);

        let largestFace = null;
        let maxFaceArea = 0;

        for (let i = 0; i < faces.size(); i++) {
            let face = faces.get(i);
            let area = face.width * face.height;
            if (area > maxFaceArea) {
                maxFaceArea = area;
                largestFace = face;
            }
        }

        if (largestFace) {
            const observedWidth = largestFace.width;
            focalLength = (observedWidth * knownDistance) / realWidth;
            alert("Calibration successful!");
        } else {
            alert("No face detected during calibration. Please try again.");
        }

        faces.delete();
        src.delete();
    }

    function initializeChart() {
        const ctx = document.getElementById('distanceChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Distance (inches)',
                    data: [],
                    borderColor: 'blue',
                    fill: false,
                    pointRadius: 2,
                    pointHoverRadius: 5
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        title: { display: true, text: 'Time (seconds)' },
                        type: 'linear',
                        position: 'bottom',
                        ticks: { autoSkip: true, maxTicksLimit: 10 }
                    },
                    y: {
                        title: { display: true, text: 'Distance (inches)' },
                        beginAtZero: true,
                        ticks: { autoSkip: true, maxTicksLimit: 10 }
                    }
                }
            }
        });
    }

    function beginGraphing() {
        if (!graphing) {
            graphing = true;
            startTime = Date.now();
            chart.data.datasets[0].data = [];
            chart.update();
            document.getElementById('beginGraphingButton').textContent = 'Stop Graphing';
        } else {
            graphing = false;
            document.getElementById('beginGraphingButton').textContent = 'Begin Graphing';
        }
    }

    function clearGraph() {
        graphing = false;
        document.getElementById('beginGraphingButton').textContent = 'Begin Graphing';
        chart.data.datasets[0].data = [];
        chart.update();
    }
</script>

</body>
</html>
